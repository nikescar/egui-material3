[workspace]

[package]
name = "ondemand"
version = "0.0.1"
edition = "2021"

[dependencies]
egui-material3 = { path = "../../" , features = ["ondemand"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "svg", "svg_text"] }
glob = "0.3"
